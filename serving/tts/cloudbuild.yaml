steps:
  - name: gcr.io/cloud-builders/docker
    args: ['pull', 'us-central1-docker.pkg.dev/$PROJECT_ID/koyokana/tts-serve:v1.2.0']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/koyokana/tts-serve:v1.2.0', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/koyokana/tts-serve:v1.3.0', '.']
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/koyokana/tts-serve:v1.3.0
timeout: 1200s
options:
  machineType: E2_HIGHCPU_8
